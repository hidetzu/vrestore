name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # FFmpeg のメジャー版はランナーの apt で決まる。ubuntu-latest だと黙って上がるので固定する（docs/adr/0001）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # ffmpeg コマンドはテスト用動画の合成に、lib*-dev はリンクに使う（libsdl2-dev / libsdl2-ttf-dev / フォントは vrestore-gui）
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config \
            libavformat-dev libavcodec-dev libswscale-dev libavutil-dev libsdl2-dev libsdl2-ttf-dev fonts-dejavu-core
          ffmpeg -version | head -1

      # Zig の版は build.zig.zon の minimum_zig_version から読む（mlugg/setup-zig の既定動作）
      - uses: mlugg/setup-zig@v2

      # 何を回すかは build.zig の check ステップが持つ（.claude/skills/verify/SKILL.md）
      - run: zig build check --summary all
